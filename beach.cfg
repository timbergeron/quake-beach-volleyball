// First-person practice controls. Exec this again to restore the mod bindings.
exec server.cfg
bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind MOUSE1 +attack
bind MOUSE2 +button3
bind MOUSE3 "impulse 12"
bind MWHEELUP "impulse 10"
bind MWHEELDOWN "impulse 11"
bind q +button4
bind e +button5
bind z "impulse 13"
bind f "impulse 40"
bind v "impulse 41"
bind b "impulse 42"
bind SPACE +jump
bind CTRL +button7
bind SHIFT +button8
bind r "impulse 20"
bind t "impulse 21"
bind 1 "impulse 30"
bind 2 "impulse 31"
bind 3 "impulse 32"
bind 4 "impulse 33"
bind 5 "impulse 34"
bind c "impulse 43"
bind j "impulse 44"
bind g "impulse 45"
bind TAB +showscores
bind h "toggle bv_help"
bind ESCAPE togglemenu
bind F12 toggleconsole
set bv_help 0
cl_forwardspeed 170
cl_backspeed 150
cl_sidespeed 170
viewsize 120
fov 100
crosshair 0
r_drawviewmodel 1
cl_bob 0.005
cl_rollangle 0
v_idlescale 0
scr_showfps 0
r_lerpmodels 2
scr_ping 0
scr_clock 0
cl_afk 0
cl_mapshots 0
cl_web_download_url ""
cl_web_download_url2 ""
gl_load24bit 1
